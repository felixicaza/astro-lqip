name: Tests

on:
   push:
      branches:
         - "**"

   pull_request:
      branches:
         - "**"

concurrency:
   group: tests-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
   cancel-in-progress: true

jobs:
   lint:
      if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
           with:
              node-version: lts/*

         - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

         - name: Install dependencies
           run: pnpm ci

         - name: Build
           run: pnpm build

         - name: Sync Astro types
           run: pnpm -r exec astro sync

         - name: Lint
           run: pnpm lint

         - name: Typecheck
           run: pnpm typecheck

   test:
      if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
      runs-on: ${{ matrix.os }}

      strategy:
         matrix:
            os: [ubuntu-latest, windows-latest, macos-latest]
            node: [lts/*]
         fail-fast: false

      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
           with:
              node-version: ${{ matrix.node }}

         - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

         - name: Install dependencies
           run: pnpm ci

         - name: Build demos
           run: pnpm demos
